name: CI Example (Expo Managed)
on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Init CI (ensure gradlew stub)
        run: |
          sh ./init-ci.sh

      - name: Node setup
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install mobile_frontend deps
        working-directory: mobile_frontend
        run: npm ci

      - name: Lint
        working-directory: mobile_frontend
        run: npm run lint

      - name: Gradle check (stub)
        run: sh ./gradle-check
